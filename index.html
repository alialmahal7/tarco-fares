<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarco Fares</title>
<style>
  :root { --navy:#14304a; --navy2:#22486b; --gold:#c9a44c; --green:#1f8a4c; --blue:#2563a8; --red:#c0392b; --bg:#eef2f6; --card:#fff; --line:#dde4ec; --ink:#1b2733; --mute:#6b7b8c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--navy); color:#fff; padding:14px 18px; position:sticky; top:0; z-index:5; }
  .hrow { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1200px; margin:0 auto; }
  .brand b { font-size:18px; letter-spacing:.3px; } .brand small { display:block; font-size:12px; opacity:.8; margin-top:2px; }
  .stations { display:flex; gap:6px; flex-wrap:wrap; }
  .stations button { border:0; background:var(--navy2); color:#fff; padding:7px 14px; border-radius:7px; font-size:14px; cursor:pointer; font-weight:600; }
  .stations button.on { background:var(--gold); color:var(--navy); }
  .stations button .n { font-weight:400; opacity:.75; font-size:12px; margin-left:4px; }
  main { max-width:1200px; margin:0 auto; padding:14px 18px 40px; }
  .tools { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
  .tools input { flex:1; height:40px; border:1px solid var(--line); border-radius:8px; padding:0 12px; font-size:15px; background:#fff; }
  .legend { font-size:12px; color:var(--mute); white-space:nowrap; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; background:var(--gold); margin-right:4px; }
  .pairs { display:grid; grid-template-columns:repeat(auto-fill, minmax(520px, 1fr)); gap:14px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card.in .rt { background:var(--blue); }
  .card.empty { background:transparent; border:1px dashed var(--line); }
  .rt { background:var(--green); color:#fff; padding:7px 10px; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .rt .via { font-weight:400; font-size:11px; opacity:.9; }
  .upd { background:var(--gold); color:var(--navy); font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; }
  .card.new { box-shadow:0 0 0 2px var(--gold); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { font-size:11px; color:var(--mute); font-weight:600; text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--line); background:#f7f9fb; }
  td { text-align:center; padding:6px 4px; border-bottom:1px solid #eef2f6; }
  tr:last-child td { border-bottom:0; }
  td.c { color:var(--red); font-weight:700; } td.u { font-weight:700; font-size:15px; } td.u::before { content:"$"; font-weight:400; color:var(--mute); font-size:12px; margin-right:1px; }
  .state { text-align:center; color:var(--mute); padding:60px 10px; font-size:15px; }
  .state.bad { color:var(--red); }
  footer { text-align:center; color:var(--mute); font-size:12px; padding:10px; }
  @media (max-width:600px) {
    header { padding:10px 12px; } main { padding:10px 10px 30px; }
    .pairs { grid-template-columns:1fr; gap:10px; }
    .pair { gap:6px; } .rt { font-size:13px; padding:6px 8px; } table { font-size:13px; } td.u { font-size:14px; } th, td { padding:5px 2px; }
    .legend { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><b>TARCO AVIATION · Fares</b><small id="upd">Loading…</small></div>
    <div class="stations" id="st"></div>
  </div>
</header>
<main>
  <div class="tools">
    <input id="q" type="search" placeholder="Search city or code (CAI, JED, DXB…)" autocomplete="off">
    <span class="legend"><i style="background:var(--green)"></i>Outbound &nbsp; <i style="background:var(--blue)"></i>Inbound &nbsp; <i></i>Changed in the last 3 days</span>
  </div>
  <div id="out" class="state">Loading fares…</div>
</main>
<footer>Prices in USD · read only</footer>
<script>
const DB = "https://pricing-kart-default-rtdb.firebaseio.com";
const ORDER = ["KRT", "PZU", "KSL", "DOG", "DOM", "TRANSIT"];
const NAMES = { DOM: "Domestic", TRANSIT: "Other" };
const RECENT = 3 * 24 * 3600 * 1000;
const $ = (id) => document.getElementById(id);
let data = null, station = localStorage.getItem("tf_station") || "KRT";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const leg = (r) => r.split("@")[0];
const fmtDate = (t) => new Date(t).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

async function load() {
  try {
    const res = await fetch(DB + "/public/fares.json?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const v = await res.json();
    if (!v || !v.json) { data = { t: 0, routes: [] }; }
    else data = JSON.parse(v.json);
    render();
  } catch (e) {
    if (!data) { $("out").className = "state bad"; $("out").textContent = "Couldn't load fares. Check your connection and refresh."; }
  }
}

function groups() {
  const c = {}; data.routes.forEach((x) => { c[x.g] = (c[x.g] || 0) + 1; });
  return Object.keys(c).sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b)).map((g) => ({ g, n: c[g] }));
}

function card(x, dir) {
  if (!x) return `<div class="card empty"></div>`;
  const recent = x.t && Date.now() - x.t < RECENT;
  const [o, d] = leg(x.r).split("-");
  return `<div class="card ${dir}${recent ? " new" : ""}">
    <div class="rt"><span>${esc(o)}-${esc(d)}${x.via ? ` <span class="via">via ${esc(x.via)}</span>` : ""}</span>${recent ? `<span class="upd">Updated</span>` : ""}</div>
    <table><tr><th>Class</th><th>USD</th><th>PC</th><th>KG</th></tr>
    ${x.rows.map((y) => `<tr><td class="c">${esc(y.c)}</td><td class="u">${Number(y.u).toLocaleString("en-US")}</td><td>${y.pc ?? "–"}</td><td>${y.kg ?? "–"}</td></tr>`).join("")}
    </table></div>`;
}

function render() {
  const gs = groups();
  if (gs.length && !gs.some((x) => x.g === station)) station = gs[0].g;
  $("st").innerHTML = gs.map((x) => `<button class="${x.g === station ? "on" : ""}" data-g="${esc(x.g)}">${esc(NAMES[x.g] || x.g)}<span class="n">${x.n}</span></button>`).join("");
  $("upd").textContent = data.t ? "Last update " + fmtDate(data.t) : "No fares published yet";
  const q = $("q").value.trim().toUpperCase();
  let list = data.routes.filter((x) => (q ? true : x.g === station));
  if (q) list = list.filter((x) => x.r.toUpperCase().includes(q));
  // pair each route with its return (same connection point)
  const used = new Set(), pairs = [];
  const key = (x) => leg(x.r) + "@" + (x.via || "");
  const byKey = {}; list.forEach((x) => { byKey[key(x)] = x; });
  list.forEach((x) => {
    if (used.has(x.r)) return; used.add(x.r);
    const [o, d] = leg(x.r).split("-"); const back = byKey[d + "-" + o + "@" + (x.via || "")];
    if (back && !used.has(back.r)) { used.add(back.r); pairs.push([x, back]); } else pairs.push(d === x.g ? [null, x] : [x, null]);
  });
  if (!pairs.length) { $("out").className = "state"; $("out").textContent = q ? "No route matches “" + $("q").value.trim() + "”." : "No fares for this station yet."; return; }
  $("out").className = "pairs";
  $("out").innerHTML = pairs.map(([a, b]) => `<div class="pair">${card(a, "out")}${card(b, "in")}</div>`).join("");
}

$("st").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; station = b.dataset.g; localStorage.setItem("tf_station", station); $("q").value = ""; render(); });
$("q").addEventListener("input", () => data && render());
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, 120000);
load();
</script>
</body>
</html>
